<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e2a27" />
    <title>Página no encontrada | Padelíticos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; font-family: Inter, Arial, sans-serif; background: #0e2a27; color: #edebde; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { display: flex; max-width: 620px; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
      .eyebrow { margin: 0; color: #c6f135; font-size: 13px; font-weight: 700; letter-spacing: .16em; }
      h1 { display: flex; align-items: center; gap: 8px; margin: 0; color: #c6f135; font-size: clamp(96px, 22vw, 176px); line-height: .95; }
      .ball { width: .78em; height: .78em; filter: drop-shadow(0 8px 20px rgba(198,241,53,.16)); }
      h2 { margin: 0; font-size: clamp(22px, 4vw, 30px); }
      .description { max-width: 38ch; margin: 0; color: #9fb6b0; line-height: 1.6; }
      a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; margin-top: 8px; padding: 0 20px; border: 1px solid #c6f135; border-radius: 12px; background: #c6f135; color: #0e2a27; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 2px solid #edebde; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main aria-labelledby="not-found-title">
      <p class="eyebrow">PADELÍTICOS</p>
      <h1 id="not-found-title" aria-label="Error 404">
        <span aria-hidden="true">4</span>
        <svg class="ball" viewBox="0 0 32 32" aria-hidden="true">
          <defs><clipPath id="ball-clip"><circle cx="16" cy="16" r="15" /></clipPath></defs>
          <circle cx="16" cy="16" r="15" fill="#93ad2c" />
          <g clip-path="url(#ball-clip)">
            <circle cx="14" cy="14" r="15" fill="#c6f135" />
            <path d="M25.5 3.2C26.2 10.7 18.7 14.6 12.6 18.7C7.8 22.1 8.5 28.3 11.9 32.4" fill="none" stroke="#e2604f" stroke-width="3.2" stroke-linecap="round" />
          </g>
        </svg>
        <span aria-hidden="true">4</span>
      </h1>
      <h2>Esta página no existe</h2>
      <p class="description">Puede que el enlace haya cambiado o que la dirección no sea correcta.</p>
      <a href="/">Volver a la página principal</a>
    </main>
  </body>
</html>
